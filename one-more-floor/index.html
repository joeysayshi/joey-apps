<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>One More Floor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed canvas is the world. A 30rem column of chunky, outlined arcade chrome sits over it:
   count top-left, icon buttons top-right, cream panels with hard drop shadows for menus and results. */
:root{
  --ink:#161a3a;                      /* every outline and hard shadow */
  --paper:#fffaf0;                    /* panels, outlined lettering */
  --sun:#ffcf3f;                      /* highlight, stars, "you" */
  --go:#45d483;                       /* the button that moves you forward */
  --sky:#58b5ee;                      /* page ground before the canvas paints */
  --lock:#b9bdd6;                     /* locked tiles */
  --bad:#c5352b; --ok:#17804a;        /* form messages */
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:800;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
input{-webkit-user-select:text;user-select:text}
#stage{position:relative;height:100%;overflow:hidden;touch-action:none;cursor:pointer}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:24px;height:24px;display:block;flex:none}

.col{
  position:absolute;inset:0;margin-inline:auto;max-width:30rem;
  padding-inline:16px;padding-block:14px;
  display:flex;flex-direction:column;pointer-events:none;
}

/* cream lettering with an ink ring, readable on any sky */
.outline{
  --o:2px;color:var(--paper);
  text-shadow:calc(var(--o)*-1) calc(var(--o)*-1) 0 var(--ink),var(--o) calc(var(--o)*-1) 0 var(--ink),
    calc(var(--o)*-1) var(--o) 0 var(--ink),var(--o) var(--o) 0 var(--ink),
    0 calc(var(--o)*-1) 0 var(--ink),0 var(--o) 0 var(--ink),calc(var(--o)*-1) 0 0 var(--ink),var(--o) 0 0 var(--ink),
    0 calc(var(--o)*2.4) 0 var(--ink);
}

/* ---- buttons ---- */
.btn{
  pointer-events:auto;cursor:pointer;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);
  font:400 1.25rem/1 var(--display);letter-spacing:.02em;padding:12px 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.tile:focus-visible,.seg button:focus-visible,.rm:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.go{background:var(--go)}
.btn.sun{background:var(--sun)}
.btn.icon{width:48px;height:48px;padding:0;border-radius:14px}
.btn.sm{font-size:1.05rem;padding:10px 14px;border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn.xl{font-size:2rem;padding:15px 18px;border-radius:20px;box-shadow:0 7px 0 var(--ink)}
.btn.xl:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.btn.xl .ic{width:30px;height:30px}

/* ---- top bar ---- */
.hud{display:flex;align-items:flex-start;gap:10px;min-height:53px}
.count{display:grid;justify-items:start;gap:7px}
.count .big{font:400 4.6rem/.8 var(--display);--o:3px;font-variant-numeric:tabular-nums;transform-origin:left bottom}
.count .big small{font-size:1.7rem;margin-left:4px}
.count .big.bump{animation:bump .18s ease-out}
@keyframes bump{from{transform:scale(1.16)}to{transform:scale(1)}}
.bar{width:132px;height:17px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.bar i{display:block;height:100%;width:0;background:var(--go);transition:width .2s}
.sub{font:900 1.05rem/1 var(--body);--o:1.5px;font-variant-numeric:tabular-nums}
.rival{font:900 .82rem/1 var(--body);background:var(--paper);border:2px solid var(--ink);border-radius:9px;padding:5px 8px;box-shadow:0 3px 0 var(--ink);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}

/* ---- home ---- */
.home{flex:1;min-height:0;display:flex;flex-direction:column}
.logo{
  margin:-34px 0 0;display:grid;justify-items:start;transform:rotate(-4deg);transform-origin:left top;
  font:400 clamp(3.3rem,min(22vw,12vh),6rem)/.9 var(--display);text-transform:uppercase;--o:3px;
}
/* each word is a floor that landed a little off the one below */
.logo span:nth-child(2){transform:translateX(.3em)}
.logo span:nth-child(3){transform:translateX(.1em)}
.homeBtns{margin-top:auto;display:grid;gap:12px;padding-bottom:1.5vh}
.who{justify-self:start;font:900 .9rem/1 var(--body);padding:8px 12px;border-radius:12px;box-shadow:0 4px 0 var(--ink);max-width:100%}
.who .ic{width:18px;height:18px}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hPlay{display:grid;grid-template-columns:auto auto;justify-content:center;column-gap:12px;row-gap:3px}
#hPlay .ic{grid-row:1 / span 2;align-self:center}
#hPlay small{font:900 .86rem/1 var(--body);letter-spacing:.04em;text-align:left}
#hPlay b{font-weight:400;text-align:left;text-transform:uppercase}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trio .btn{flex-direction:column;gap:6px;font-size:1.05rem;padding:11px 6px}

/* ---- full screens: levels, friends ---- */
.screen{
  flex:1;min-height:0;margin-top:2px;overflow-y:auto;overflow-x:hidden;pointer-events:auto;touch-action:pan-y;cursor:default;
  display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:12px;padding:0 4px 12px;
}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.shead h2{margin:0;font:400 2.7rem/1 var(--display);text-transform:uppercase;--o:3px}
.tally{font:400 1.3rem/1 var(--display);display:inline-flex;align-items:center;gap:5px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.tile{
  aspect-ratio:1;display:grid;place-items:center;align-content:center;gap:5px;cursor:pointer;padding:0;
  color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);
  font:400 1.9rem/1 var(--display);transition:transform .06s,box-shadow .06s;
}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile.now{background:var(--sun)}
.tile.locked{background:var(--lock);color:rgba(22,26,58,.55);cursor:default}
.tile.locked:active{transform:none;box-shadow:0 5px 0 var(--ink)}
.tile .s{display:flex;gap:1px}
.tip{margin:0;font:800 .9rem/1.35 var(--body);--o:1.5px}

.st{width:1em;height:1em;display:block;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;fill:rgba(22,26,58,.14)}
.st.on{fill:var(--sun)}
.tile .st{font-size:15px}
.tally .st{font-size:20px}

.panel{
  pointer-events:auto;background:var(--paper);color:var(--ink);
  border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:14px 16px 16px;
}
.card{display:grid;gap:9px}
.lab{font:900 .76rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase}
.rowin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
input{
  box-sizing:border-box;min-width:0;width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;
  font:800 1rem/1.2 var(--body);background:#fff;color:var(--ink);
}
input::placeholder{color:rgba(22,26,58,.45)}
.msg{margin:0;font:800 .88rem/1.35 var(--body);color:rgba(22,26,58,.7)}
.msg:empty{display:none}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.back{display:grid;gap:6px}
.back div{display:flex;align-items:center;justify-content:space-between;gap:8px;font:800 .95rem/1.2 var(--body)}
.back div>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back .do{display:flex;align-items:center;gap:8px;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--ink);font:400 1.05rem/1 var(--display);padding:10px 6px;cursor:pointer}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg.small button{font-size:.92rem;padding:7px 6px}
.board{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li{
  display:grid;grid-template-columns:1.7rem minmax(0,1fr) auto auto;align-items:center;gap:8px;
  padding:7px 10px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:800 1rem/1.2 var(--body);
}
.board li.me{background:var(--sun)}
.board .rk{font:400 1.1rem/1 var(--display);text-align:center}
.board .nm{display:flex;align-items:center;gap:6px;min-width:0}
.board .nm b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .tg{flex:none;font:900 .6rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);border-radius:6px;padding:2px 4px}
.board .vl{font:400 1.2rem/1 var(--display);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.board .vl .st{font-size:17px}
.rm{width:30px;height:30px;display:grid;place-items:center;padding:0;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:9px}
.rm .ic{width:14px;height:14px}

/* ---- level brief (top) and results (bottom) ---- */
.brief{margin-top:10px;display:grid;gap:8px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
.over{margin-top:auto;display:grid;gap:10px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.tag{justify-self:start;margin:0;font:900 .72rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:8px;padding:5px 8px}
.panel h2{margin:0;font:400 clamp(2.1rem,11vw,2.8rem)/.95 var(--display);text-transform:uppercase;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.panel h2 small{font-size:.5em}
.hint{margin:0;font:800 1rem/1.35 var(--body)}
.goal{justify-self:start;margin:0;font:400 1.05rem/1 var(--display);background:var(--sun);border:2px solid var(--ink);border-radius:9px;padding:6px 9px}
.stars{display:flex;gap:6px;font-size:3.1rem}
.stars .st{stroke-width:1.9}
.stars .st.on{animation:star .3s cubic-bezier(.2,1.4,.4,1) both}
.stars .st:nth-child(2){animation-delay:.14s}
.stars .st:nth-child(3){animation-delay:.28s}
@keyframes star{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.stats{display:flex;gap:22px;margin:0}
.stats div{display:grid;gap:2px}
.stats dt{font:900 .68rem/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:rgba(22,26,58,.66)}
.stats dd{margin:0;font:400 1.55rem/1 var(--display);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center}
.actions.two{grid-template-columns:auto minmax(0,1fr)}

.prompt{margin:auto 0 7vh;text-align:center;font:400 1.6rem/1 var(--display);text-transform:uppercase;animation:breathe 1.4s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.07)}}

.toast{
  position:absolute;left:50%;top:27%;transform:translateX(-50%);
  width:max-content;max-width:calc(100% - 32px);text-align:center;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);
  padding:8px 14px;font:400 1.2rem/1.1 var(--display);
}
.toast.show{animation:toast 1.9s ease-out both}
@keyframes toast{
  0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9)}
  10%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-8px) scale(1)}
}

/* the verdict that slams in the moment a run ends */
.stamp{
  position:absolute;left:16px;right:16px;top:23%;text-align:center;pointer-events:none;
  font:400 clamp(2.5rem,13vw,3.6rem)/.95 var(--display);text-transform:uppercase;--o:3px;
  transform:rotate(-5deg);text-wrap:balance;
}
.stamp.win{color:var(--sun)}
.stamp.lose{color:#ff9384}
.stamp.show{animation:stamp .34s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-5deg) scale(2.3)}to{opacity:1;transform:rotate(-5deg) scale(1)}}

@media (prefers-reduced-motion:reduce){
  .prompt,.brief,.over,.toast.show,.stamp.show,.count .big.bump,.stars .st.on{animation:none}
  .btn,.tile{transition:none}
}
</style>

<svg class="defs" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7.5 10.5V8a4.5 4.5 0 0 1 9 0v2.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><rect x="5" y="10.5" width="14" height="10" rx="3" fill="currentColor"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M19.2 13a7.2 7.2 0 1 1-2.2-6.2" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M18.6 2.8v5h-5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2" fill="currentColor"/><rect x="13.5" y="3.5" width="7" height="7" rx="2" fill="currentColor"/><rect x="3.5" y="13.5" width="7" height="7" rx="2" fill="currentColor"/><rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11.5L12 4l8.5 7.5V19a1.5 1.5 0 0 1-1.5 1.5h-4V15h-6v5.5H5A1.5 1.5 0 0 1 3.5 19z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5L7.5 12l7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7.5 3.5h9V9a4.5 4.5 0 0 1-9 0z" fill="currentColor"/><path d="M7.5 5.5H4.2A3.3 3.3 0 0 0 7.8 9.6M16.5 5.5h3.3a3.3 3.3 0 0 1-3.6 4.1M12 13.5v4M8 20.5h8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-inf" viewBox="0 0 24 24"><path d="M7.4 16a4 4 0 1 1 0-8c3.4 0 5.8 8 9.2 8a4 4 0 1 0 0-8c-3.4 0-5.8 8-9.2 8z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="currentColor"/><path d="M4 20.5a8 8 0 0 1 16 0z" fill="currentColor"/></symbol>
  </defs>
</svg>

<div id="stage">
  <canvas id="c" role="img" aria-label="A tower being built floor by floor. Tap, or press Space, to drop the sliding floor."></canvas>
  <div class="col">
    <header class="hud">
      <div class="count" id="count" hidden>
        <div class="big outline" id="big"><span id="num">0</span><small id="den"></small></div>
        <div class="bar" id="bar" hidden><i id="barFill"></i></div>
        <div class="sub outline" id="sub" hidden>0 m</div>
        <div class="rival" id="rival" hidden></div>
      </div>
      <div class="right">
        <button id="bRestart" class="btn icon" type="button" aria-label="Restart" hidden><svg class="ic" aria-hidden="true"><use href="#i-restart"></use></svg></button>
        <button id="bBack" class="btn icon" type="button" aria-label="Back" hidden><svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg></button>
        <button id="bSound" class="btn icon" type="button" aria-pressed="false" aria-label="Sound is on. Turn sound off.">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 9v6h4l5.5 4.5v-15L7.5 9h-4z" fill="currentColor" stroke="none"></path>
            <path id="waves" d="M16.5 8.8a4.6 4.6 0 0 1 0 6.4M19.2 6.2a8.2 8.2 0 0 1 0 11.6"></path>
            <path id="slash" d="M17 9.5l5 5M22 9.5l-5 5" hidden></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="home" id="home">
      <h1 class="logo outline"><span>One</span><span>More</span><span>Floor</span></h1>
      <div class="homeBtns">
        <button id="hWho" class="btn who" type="button"><svg class="ic" aria-hidden="true"><use href="#i-user"></use></svg><span id="hWhoText">Pick a username</span></button>
        <button id="hPlay" class="btn go xl" type="button"><svg class="ic" aria-hidden="true"><use href="#i-next"></use></svg><b>Play</b><small id="hPlaySub">Level 1</small></button>
        <div class="trio">
          <button id="hLevels" class="btn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-grid"></use></svg><span>Levels</span></button>
          <button id="hEndless" class="btn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-inf"></use></svg><span>Endless</span></button>
          <button id="hFriends" class="btn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-trophy"></use></svg><span>Friends</span></button>
        </div>
      </div>
    </section>

    <section class="screen" id="levels" hidden>
      <div class="shead"><h2 class="outline">Levels</h2><span class="tally outline" id="tally"></span></div>
      <div class="grid" id="grid"></div>
      <p class="tip outline">Clear a level to open the next one. Keep 80% of your width for three stars.</p>
    </section>

    <section class="screen" id="friendsScr" hidden>
      <div class="shead"><h2 class="outline">Friends</h2></div>
      <div class="panel card">
        <label class="lab" for="nameIn">Your username</label>
        <div class="rowin">
          <input id="nameIn" type="text" maxlength="14" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="3 to 14 letters or numbers">
          <button id="nameSave" class="btn sun sm" type="button">Save</button>
        </div>
        <p class="msg" id="nameMsg"></p>
        <p class="msg" id="netStatus"></p>
        <div class="back" id="localList" hidden></div>
        <button id="newPlayer" class="btn sm" type="button">New player on this device</button>
      </div>
      <div class="panel card">
        <label class="lab" for="friendIn">Add a friend</label>
        <div class="rowin">
          <input id="friendIn" type="text" maxlength="600" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Username or friend code">
          <button id="friendAdd" class="btn go sm" type="button">Add</button>
        </div>
        <p class="msg" id="friendMsg"></p>
        <div class="back" id="addedYou" hidden></div>
        <button id="codeBtn" class="btn sm" type="button">Copy my friend code</button>
        <input id="codeOut" type="text" readonly aria-label="Your friend code" hidden>
        <p class="msg" id="codeMsg"></p>
      </div>
      <div class="panel card">
        <div class="seg" id="segBoard">
          <button type="button" data-board="endless" class="on" aria-pressed="true">Endless</button>
          <button type="button" data-board="levels" aria-pressed="false">Levels</button>
        </div>
        <div class="seg small" id="segScope">
          <button type="button" data-scope="device" class="on" aria-pressed="true">This device</button>
          <button type="button" data-scope="friends" aria-pressed="false">Friends</button>
          <button type="button" data-scope="all" aria-pressed="false">Everyone</button>
        </div>
        <ol class="board" id="board"></ol>

<script>
(() => {
  'use strict';

  const el = {};

  ].forEach(k => { el[k] = $(k); });

  /* ---------- constants (world units; one floor is 24 units thick) ---------- */

  const SLAB_H = 24, VIEW_W = 340, TRAVEL = 185, GRID = 11;
  const ANCHOR = 0.64;        // upright builds: tower top sits this far down the screen
  const AX = 0.42, AY = 0.52; // sideways builds: leading edge and centre line
  const HY = 140, FALL_T = 0.36;
  const INK = '#161a3a', PAPER = '#fffaf0', GROUND = '#151a3c';

  const LANDMARKS = [
    { name: 'a giraffe', h: 5.5 },
    { name: 'the Hollywood Sign', h: 13.7 },
    { name: 'a blue whale on its tail', h: 30 },
    { name: 'the Leaning Tower of Pisa', h: 56 },
    { name: 'the Statue of Liberty', h: 93 },
    { name: 'the Great Pyramid of Giza', h: 139 },
    { name: 'the Washington Monument', h: 169 },
    { name: 'the Golden Gate Bridge', h: 227 },
    { name: 'Sydney Tower', h: 309 },
    { name: 'the Eiffel Tower', h: 330 },
    { name: 'the Empire State Building', h: 443 },
    { name: 'Shanghai Tower', h: 632 },
    { name: 'the Burj Khalifa', h: 828 }
  ];

  /* A level sets the pace (sp0, ramp, cap), the pieces (style, w0) and the trick (side, m). */
  const LV = (name, hint, o) => Object.assign({ name, hint, unit: 'Floor', units: 'floors', target: 10, sp0: 120, ramp: 2.5, cap: 160, w0: 176,
    side: false, style: 'office', alt0: 0, hue0: 192, hueStep: 6.5, m: {} }, o);
  const SIDE = { side: true, unit: 'Span', units: 'spans', style: 'truss', hue0: 14, hueStep: 0 };
  const ENDLESS = LV('Endless', '', { target: Infinity, sp0: 128, ramp: 3.1, cap: 330, jitterFrom: 8 });
  const LEVELS = [
    LV('Groundwork', 'Tap when the floor is over the tower. Overhang gets cut off.', { target: 6, sp0: 105, cap: 130 }),
    LV('Sideways', 'Same job on its side. Bolt on spans until you reach the far cliff.', Object.assign({}, SIDE, { target: 8, sp0: 120, ramp: 3, cap: 160, alt0: 14 })),
